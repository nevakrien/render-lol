plugins {
    id 'com.android.application'
}

android {
    namespace 'com.renderlol'
    compileSdkVersion 35

    defaultConfig {
        applicationId 'com.renderlol'
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-28',
                          '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Debug'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
